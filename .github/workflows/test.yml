name: test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    # Only run if frontend/package.json exists (this repo always has it, but guard costs nothing)
    steps:
      - uses: actions/checkout@v4

      - name: Check for frontend/package.json
        id: check
        run: |
          if [ -f frontend/package.json ]; then echo "exists=true" >> $GITHUB_OUTPUT; else echo "exists=false" >> $GITHUB_OUTPUT; fi

      - name: Set up Node 20
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

      - name: Verify build output
        if: steps.check.outputs.exists == 'true'
        run: test -d frontend/dist && echo "frontend build ok"
